<!doctype html>
<html lang="en" translate="no">
  <head>
    <!-- customize head -->
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="referrer" content="same-origin" />
    <meta name="color-scheme" content="light dark" />
    <meta name="generator" content="OpenList" />
    <meta name="theme-color" content="#000000" />
    <meta name="google" content="notranslate" />
    <link href="/manifest.json" rel="manifest" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="OpenList" />
    <link rel="apple-touch-icon" href="https://res.oplist.org/logo/logo.png" />
    <link
      rel="shortcut icon"
      type="image/ico"
      href="https://res.oplist.org/logo/logo.svg"
    />
    <title>Loading...</title>
    <script>
      window.OPENLIST_CONFIG = {
        cdn: undefined,
        base_path: undefined,
        api: undefined,
        main_color: undefined,
      }
      window.__dynamic_base__ = window.OPENLIST_CONFIG.cdn || ""
      ;(function () {
        var ua = window.navigator.userAgent || ""
        var iosDevice = /iPhone|iPad|iPod/.test(ua)
        var ipadDesktop =
          /Macintosh/.test(ua) && window.navigator.maxTouchPoints > 1
        var iosVersion = ua.match(/OS (\d+)[._](\d+)/)
        var safariVersion = ua.match(/Version\/(\d+)[.](\d+)/)
        var major = iosVersion
          ? Number(iosVersion[1])
          : ipadDesktop && safariVersion
            ? Number(safariVersion[1])
            : 0
        var desktopSafari =
          !iosDevice &&
          !ipadDesktop &&
          /Safari\//.test(ua) &&
          !/Chrome|Chromium|CriOS|EdgiOS|FxiOS/.test(ua)
        var desktopSafariMajor =
          desktopSafari && safariVersion ? Number(safariVersion[1]) : 0
        window.__openlist_force_legacy__ =
          ((iosDevice || ipadDesktop) && major > 0 && major < 16) ||
          (desktopSafariMajor > 0 && desktopSafariMajor < 16)
      })()
    </script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>

    <script src="/src/main.tsx" type="module"></script>
    <!-- customize body -->
  </body>
</html>
